<!doctype html>
<html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Geldplan v35</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
<header><h1>💎 Mein Geldplan</h1><div id="date"></div></header>
<section class="hero"><small>Gesamtvermögen</small><h2 id="total"></h2>
<div class="split"><div><span>Giro</span><strong id="giro"></strong></div><div><span>Bargeld</span><strong id="cash"></strong></div></div></section>
<section class="card"><h3>Budget</h3><div class="grid">
<div><label>Resttage</label><b id="days"></b></div>
<div><label>Tagessatz</label><b id="day"></b></div>
<div><label>Wochensatz</label><b id="week"></b></div>
<div><label>Nächster Lohn</label><b id="pay"></b></div></div></section>
<section class="card"><h3>Wochenabschluss</h3>
<p>Ziel-Bargeld: 120 €</p>
<button onclick="recommend()">Empfehlung berechnen</button>
<p id="rec"></p></section>
<section class="card"><h3>Bargeld korrigieren</h3>
<input id="amt" type="number" step="0.01" placeholder="Betrag">
<div class="row"><button onclick="change(1)">+ Bargeld</button><button class="alt" onclick="change(-1)">− Bargeld</button></div></section>
<footer>v35 – Konzeptbasis für GitHub Pages</footer></div>
<script src="app.js"></script></body></html>
