<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mein Geldplan">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Mein Geldplan v35 Final</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MEIN GELDPLAN</div>
        <h1>Finanzen im Blick.</h1>
      </div>
      <div id="connection-pill" class="status-pill"><span class="status-dot"></span> Bereit</div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-view="overview" class="nav-item active" type="button"><span class="nav-icon">⌂</span><span>Übersicht</span></button>
      <button data-view="history" class="nav-item" type="button"><span class="nav-icon">↺</span><span>Verlauf</span></button>
      <button data-view="fixed" class="nav-item" type="button"><span class="nav-icon">◫</span><span>Fixkosten</span></button>
      <button data-view="payroll" class="nav-item" type="button"><span class="nav-icon">€</span><span>Gehalt</span></button>
      <button data-view="backup" class="nav-item" type="button"><span class="nav-icon">⬡</span><span>Backup</span></button>
    </nav>
  </div>

  <script src="storage.js"></script>
  <script src="history.js"></script>
  <script src="fixkosten.js"></script>
  <script src="budget.js"></script>
  <script src="payroll.js"></script>
  <script src="app.js"></script>
</body>
</html>
